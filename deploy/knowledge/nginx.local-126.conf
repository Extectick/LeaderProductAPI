server {
    listen 443 ssl;
    server_name 192.168.30.126;
    ssl_certificate /etc/nginx/knowledge/server.crt;
    ssl_certificate_key /etc/nginx/knowledge/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /.well-known/carddav { return 301 https://$http_host/remote.php/dav/; }
    location = /.well-known/caldav { return 301 https://$http_host/remote.php/dav/; }
    location / {
        set $knowledge_backend nextcloud:80;
        proxy_pass http://$knowledge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
