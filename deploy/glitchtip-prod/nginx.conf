# Only the production project's ingestion endpoints are public.
location ~ ^/sentry/api/3/(envelope|store|minidump)/?$ {
    limit_except POST { deny all; }
    limit_req zone=leader_crash_prod burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 8m;
    access_log off;
    rewrite ^/sentry/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:19001;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
}
location /sentry/ { return 404; }
