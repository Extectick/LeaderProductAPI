# Include inside the HTTPS server for api.leader-product.ru.
location = /download {
    alias /var/www/leader-product-download/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}

location = /download/ {
    add_header Cache-Control "no-store, max-age=0" always;
    return 302 /download;
}

location = /download/app.js {
    alias /var/www/leader-product-download/app.js;
    default_type application/javascript;
    charset utf-8;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}
