# Include inside the existing dev.leader-product.ru TLS server, not production.
# DSN: https://PUBLIC_KEY@dev.leader-product.ru/sentry/PROJECT_ID
location ~ ^/sentry/api/[0-9]+/(envelope|store|minidump)/$ {
    limit_req zone=leader_sentry_dev burst=30 nodelay;
    limit_req_status 429;
    limit_except POST OPTIONS { deny all; }
    client_max_body_size 10m;
    access_log off;
    rewrite ^/sentry/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:19001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

# Only SDK ingestion is public. Sentry admin/API stays local to the workstation.
location /sentry/ { return 404; }
