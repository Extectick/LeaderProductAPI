name: Help development diagnostics

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Read development Help storage status
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            docker inspect leader_api_dev --format 'Development API image: {{.Config.Image}}; running={{.State.Running}}'
            docker logs --since 30m leader_api_dev 2>&1 | grep -E '^\[help\] (request failed|storage unavailable)' | tail -n 10 || true
            docker exec -i leader_api_dev node <<'NODE'
            const {S3Client,HeadBucketCommand,GetBucketPolicyCommand}=require('@aws-sdk/client-s3');
            const env=process.env;
            if(env.NODE_ENV!=='development'||env.S3_ENV_PREFIX!=='dev') throw new Error('Development isolation check failed');
            const bucket=env.HELP_S3_BUCKET||env.S3_BUCKET||'leader-product';
            const dedicatedKeys=!!(env.HELP_S3_ACCESS_KEY||env.HELP_S3_SECRET_KEY);
            const s3=new S3Client({endpoint:env.HELP_S3_ENDPOINT||env.S3_ENDPOINT,region:env.HELP_S3_REGION||env.S3_REGION||'us-east-1',forcePathStyle:true,credentials:{accessKeyId:dedicatedKeys?env.HELP_S3_ACCESS_KEY||'':env.S3_ACCESS_KEY,secretAccessKey:dedicatedKeys?env.HELP_S3_SECRET_KEY||'':env.S3_SECRET_KEY}});
            console.log(JSON.stringify({bucket,length:bucket.length,explicitBucket:!!env.HELP_S3_BUCKET,dedicatedKeys}));
            (async()=>{
              for(const [operation,command] of [['HeadBucket',new HeadBucketCommand({Bucket:bucket})],['GetBucketPolicy',new GetBucketPolicyCommand({Bucket:bucket})]]) {
                try {
                  const result=await s3.send(command);
                  let publicAllow;
                  if(operation==='GetBucketPolicy') {
                    const raw=JSON.parse(result.Policy||'{}').Statement||[];
                    const statements=Array.isArray(raw)?raw:[raw];
                    publicAllow=statements.some(s=>s.Effect==='Allow'&&(s.Principal==='*'||JSON.stringify(s.Principal||{}).includes('"*"')));
                  }
                  console.log(JSON.stringify({operation,ok:true,status:result.$metadata?.httpStatusCode,publicAllow}));
                } catch(error) {
                  console.log(JSON.stringify({operation,ok:false,name:error.name,code:error.Code||error.code,status:error.$metadata?.httpStatusCode}));
                }
              }
            })().catch(()=>{console.error('Storage diagnostics failed');process.exitCode=1;});
            NODE
