name: Build & Deploy API

on:
  push:
    branches: [dev, main, production]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      help_diagnostics:
        description: 'Read-only development Help diagnostics; skip build and deployment'
        required: false
        type: boolean
        default: false
      image_tag:
        description: 'Docker image tag to publish/deploy'
        required: false
        default: latest
      git_ref:
        description: 'Git branch/tag/commit to checkout on the production server'
        required: false
        default: main
      deploy:
        description: 'Deploy to production after image push'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: extectick/leaderproductapi

jobs:
  help-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.help_diagnostics && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/help-dev-diagnostics.yml
    secrets: inherit

  order-integrity-check:
    if: inputs.help_diagnostics != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/LeaderAPI_test
      - run: npm run type-check
      - run: npm run test:unit -- --runInBand __tests__/clientOrderAmendments.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/acceptedClientOperation.unit.test.ts __tests__/acceptedSubmissionOperation.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/clientOrderSubmissions.unit.test.ts __tests__/clientOrderSubmissionWorker.unit.test.ts __tests__/legacyOrderSubmission.unit.test.ts __tests__/clientOrders.delivery.unit.test.ts __tests__/onecBackgroundTimeout.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/stockWarehouseGroups.unit.test.ts __tests__/stockBalancesProducts.unit.test.ts __tests__/stockIncomingCosts.unit.test.ts __tests__/stockMovements.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/stockBalancesProducts.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/stockAvailability.unit.test.ts __tests__/offlineExportPolicy.unit.test.ts __tests__/clientOrders.onec-live.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/orderShare.unit.test.ts __tests__/orderShare.service.unit.test.ts __tests__/orderShare.weights.unit.test.ts __tests__/orderShare.weightRefresh.unit.test.ts __tests__/orderShare.invoiceShadow.unit.test.ts __tests__/orderShare.errors.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/ota.manifest.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/clientOrderDraftBackups.unit.test.ts __tests__/clientOrders.routes.live.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/crashEvents.unit.test.ts __tests__/crashRoutes.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/orderIntegrity.unit.test.ts __tests__/clientOrdersExportIntegrity.unit.test.ts __tests__/clientOrders.schemas.unit.test.ts __tests__/clientOrders.service.unit.test.ts __tests__/clientOrders.invoiceShadow.unit.test.ts __tests__/onec.orderQueuePayload.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/onec.orderWriteSafety.unit.test.ts __tests__/clientOrdersExportRetry.unit.test.ts __tests__/onec.lp-app-client.client-orders.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/onec.orderSnapshotRecovery.unit.test.ts
      - run: npm run test:unit -- --runInBand __tests__/help.policy.unit.test.ts __tests__/help.storage.unit.test.ts

  build-and-push:
    needs: order-integrity-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      git_ref: ${{ steps.vars.outputs.git_ref }}
      deploy: ${{ steps.vars.outputs.deploy }}
      deploy_target: ${{ steps.vars.outputs.deploy_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deploy vars
        id: vars
        shell: bash
        run: |
          deploy=false
          git_ref="${GITHUB_REF_NAME}"
          image_tag=dev
          publish_latest=false
          deploy_target=development

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "dev" ]; then
            deploy=true
          fi

          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            image_tag="${{ github.event.release.tag_name }}"
            git_ref="${{ github.event.release.tag_name }}"
            deploy=true
            publish_latest=true
            deploy_target=production
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            image_tag="${{ inputs.image_tag }}"
            git_ref="${{ inputs.git_ref }}"
            deploy="${{ inputs.deploy }}"
            [ -n "$image_tag" ] || image_tag=latest
            [ -n "$git_ref" ] || git_ref=main
            [ "$image_tag" = "latest" ] && publish_latest=true
            if [ "$git_ref" = "dev" ] || [ "$image_tag" = "dev" ]; then
              deploy_target=development
            else
              deploy_target=production
            fi
          elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "production" ]; then
            image_tag=latest
            git_ref="${GITHUB_REF_NAME}"
            deploy=true
            publish_latest=true
            deploy_target=production
          fi

          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${image_tag}"
            echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
            if [ "$publish_latest" = "true" ] && [ "$image_tag" != "latest" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
            fi
            echo "EOF"
            echo "image_tag=$image_tag"
            echo "git_ref=$git_ref"
            echo "deploy=$deploy"
            echo "deploy_target=$deploy_target"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build-and-push
    if: needs.build-and-push.outputs.deploy == 'true' && needs.build-and-push.outputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production

    steps:
      - name: Deploy production API
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          GIT_REF: ${{ needs.build-and-push.outputs.git_ref }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,GIT_REF
          script: |
            set -euo pipefail
            cd /opt/leader-api

            git fetch origin "$GIT_REF"
            git checkout -B "$GIT_REF" "origin/$GIT_REF"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps api
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
                exit 0
              fi
              sleep 2
            done
            exit 1

  deploy-development:
    needs: build-and-push
    if: needs.build-and-push.outputs.deploy == 'true' && needs.build-and-push.outputs.deploy_target == 'development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: development

    steps:
      - name: Deploy development API
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          GIT_REF: ${{ needs.build-and-push.outputs.git_ref }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,GIT_REF
          script: |
            set -euo pipefail
            cd /opt/leader-api-dev

            git fetch origin "$IMAGE_TAG"
            # Preserve the server checkout and its local Compose settings unchanged.
            # A three-way merge in an isolated release checkout fails safely on conflict.
            mkdir -p releases
            release_dir=$(mktemp -d "/opt/leader-api-dev/releases/help-${IMAGE_TAG:0:12}-XXXXXX")
            git worktree add --detach "$release_dir" "$IMAGE_TAG"
            git diff HEAD -- docker-compose.server-dev.yml > "$release_dir/local-server-config.patch"
            if [ -s "$release_dir/local-server-config.patch" ]; then
              git -C "$release_dir" apply --3way "$release_dir/local-server-config.patch"
            fi
            ln -s /opt/leader-api-dev/.env "$release_dir/.env"
            cd "$release_dir"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f docker-compose.server-dev.yml config --format json | python3 -c 'import json,sys; a=json.load(sys.stdin)["services"]["api"]; e=a.get("environment",{}); assert e.get("NODE_ENV")=="development", "Wrong environment"; assert str(e.get("DB_ACCEPT_DATA_LOSS"))=="0" and e.get("DB_INIT_MODE")=="verify", "Unsafe database initialization"; assert all(v.get("type")!="bind" for v in a.get("volumes",[])), "Unreviewed server bind mount"; assert all(p.get("host_ip")=="127.0.0.1" for p in a.get("ports",[])), "Unexpected public port"; print("Development release configuration verified")'
            docker compose -f docker-compose.server-dev.yml pull api
            docker compose -f docker-compose.server-dev.yml up -d postgres-dev redis-dev
            # Back up only the isolated development database before the additive Help migration.
            # Keep the running API untouched if backup or migration validation fails.
            umask 077
            mkdir -p /opt/leader-api-dev/backups
            backup="/opt/leader-api-dev/backups/help-${IMAGE_TAG}-$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker compose -f docker-compose.server-dev.yml exec -T postgres-dev sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup"
            test -s "$backup"
            docker compose -f docker-compose.server-dev.yml exec -T postgres-dev pg_restore --list < "$backup" > /dev/null
            dev_db=$(docker compose -f docker-compose.server-dev.yml exec -T postgres-dev sh -c 'printf %s "$POSTGRES_DB"')
            docker compose -f docker-compose.server-dev.yml run --rm --no-deps -e HELP_MIGRATION_TARGET=dev -e HELP_MIGRATION_DATABASE_CONFIRM="$dev_db" --entrypoint node api scripts/apply-help-migration.js
            docker compose -f docker-compose.server-dev.yml run --rm --no-deps --entrypoint node api scripts/init-db.js
            docker compose -f docker-compose.server-dev.yml up -d --no-deps api

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/health >/dev/null; then
                docker compose -f docker-compose.server-dev.yml ps
                docker compose -f docker-compose.server-dev.yml exec -T -e HELP_SMOKE_TARGET=dev -e HELP_SMOKE_DATABASE_CONFIRM="$dev_db" api node scripts/help-dev-smoke.cjs
                exit 0
              fi
              sleep 2
            done

            docker compose -f docker-compose.server-dev.yml logs --tail=100 api
            exit 1
