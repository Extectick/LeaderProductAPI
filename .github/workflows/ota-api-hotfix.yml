name: Read-only production order inbox diagnostic
on:
  workflow_dispatch:
    inputs:
      backup:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Guarded pre-release backup
        if: inputs.backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            umask 077
            cd /opt/leader-api
            target=/opt/leader-api/backups/prod-order-status-delivery-20261018
            test ! -e "$target"
            mkdir -m 700 "$target"
            cp -p .env "$target/env.before"
            cp -p docker-compose.yml "$target/compose.before.yml"
            cp -p docker-compose.prod.yml "$target/compose.prod.before.yml"
            sha256sum .env docker-compose.yml docker-compose.prod.yml > "$target/config-checksums.before"
            git rev-parse HEAD > "$target/git.before.txt"
            docker inspect leader_api --format '{{.Config.Image}}' > "$target/image.before.txt"
            readlink -f /var/www/leader-order-prod/current > "$target/web.before.txt"
            tar -czf "$target/web.before.tar.gz" -C /var/www/leader-order-prod/current .
            actual_db=$(docker exec leader_postgres sh -c 'printf %s "$POSTGRES_DB"')
            test "$actual_db" = LeaderAPI
            docker exec leader_postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-acl' > "$target/prod-before.dump"
            docker exec -i leader_postgres pg_restore --list < "$target/prod-before.dump" > "$target/contents.txt"
            test -s "$target/contents.txt"
            sha256sum "$target/prod-before.dump" "$target/web.before.tar.gz"
            stat -c '%a %s %n' "$target/prod-before.dump"
            df -h /
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -eu
            docker inspect leader_api --format '{{.State.Health.Status}} {{.Config.Image}}'
            docker exec -i leader_api node <<'NODE'
            const deadline=setTimeout(()=>{console.error('Diagnostic deadline');process.exit(2)},125000);
            const {default:db,pool}=require('/app/dist/prisma/client');
            const clean=v=>JSON.parse(JSON.stringify(v).replace(/(apiKey[=\"\s:]+)[^&\s\"]+/gi,'$1[redacted]').replace(/postgres(?:ql)?:\/\/[^\s\"]+/gi,'[database]'));
            (async()=>{
              if(!String(process.env.ONEC_LP_APP_BASE_URL).toLowerCase().includes('torg2026'))throw Error('Not production 1C');
              console.log(JSON.stringify({stage:'flags',at:new Date().toISOString(),asyncEnabled:process.env.CLIENT_ORDERS_ASYNC_SUBMISSIONS_ENABLED,workerDisabled:process.env.CLIENT_ORDERS_SUBMISSION_WORKER_DISABLED,exportDisabled:process.env.CLIENT_ORDERS_EXPORT_WORKER_DISABLED}));
              console.log(JSON.stringify({submissionCounts:await db.clientOrderSubmission.groupBy({by:['state'],_count:true})}));
              const submissions=await db.clientOrderSubmission.findMany({where:{OR:[{state:{not:'QUEUED'}},{acceptedAt:{gte:new Date('2026-10-17T18:00:00Z')}}]},orderBy:{acceptedAt:'asc'},take:60});
              for(const s of submissions)console.log(JSON.stringify(clean({stage:'submission',id:s.id,userId:s.userId,clientOrderId:s.clientOrderId,revision:s.clientRevision,state:s.state,orderGuid:s.orderGuid,attempts:s.attempts,nextAttemptAt:s.nextAttemptAt,leaseUntil:s.leaseUntil,errorCode:s.errorCode,errorMessage:s.errorMessage,errorDetails:s.errorDetails,acceptedAt:s.acceptedAt,updatedAt:s.updatedAt,deliveryMethod:s.payload?.deliveryMethod,deliveryDate:s.payload?.deliveryDate,rows:s.payload?.items?.length})));
              const orders=await db.order.findMany({where:{source:'MANAGER_APP',OR:[{guid:{startsWith:'898cecdb'}},{guid:{startsWith:'d6a73aa7'}},{guid:{startsWith:'af0d2187'}},{number1c:{in:['НОУТ-125312','НОУТ-125211']}},{status:{in:['QUEUED','REJECTED']},updatedAt:{gte:new Date('2026-10-15T18:00:00Z')}}]},orderBy:{updatedAt:'desc'},take:65,select:{id:true,guid:true,clientOrderId:true,clientRevision:true,revision:true,number1c:true,status:true,syncState:true,createdByUserId:true,createdAt:true,updatedAt:true,queuedAt:true,submitRequestedAt:true,sentTo1cAt:true,exportAttempts:true,lastExportError:true,last1cError:true,isPostedIn1c:true,totalAmount:true,deliveryMethod:true,deliveryDate:true,counterparty:{select:{name:true}},createdByUser:{select:{firstName:true,lastName:true}},_count:{select:{items:true}}}});
              console.log(JSON.stringify(clean({stage:'orders',orders})));
              console.log(JSON.stringify({stage:'recent-order-counts',counts:await db.order.groupBy({by:['status','syncState'],where:{source:'MANAGER_APP',createdAt:{gte:new Date('2026-10-15T18:00:00Z')}},_count:true})}));
              console.log(JSON.stringify(clean({stage:'recent-exceptions',orders:await db.order.findMany({where:{source:'MANAGER_APP',updatedAt:{gte:new Date('2026-10-15T18:00:00Z')},OR:[{lastExportError:{not:null}},{last1cError:{not:null}},{syncState:{in:['ERROR','CONFLICT','QUEUED']}},{status:'SENT_TO_1C'}]},take:40,select:{guid:true,number1c:true,createdByUserId:true,status:true,syncState:true,isPostedIn1c:true,lastExportError:true,last1cError:true,queuedAt:true,sentTo1cAt:true}})})));
              const {findLiveClientOrder}=require('/app/dist/modules/clientOrders/clientOrders.onecLive');
              const {getStoredClientOrderForSubmission}=require('/app/dist/modules/clientOrders/clientOrders.service');
              for(const prefix of ['898cedcb','d6a73aa7','af0d2187']){
                const order=await db.order.findFirst({where:{guid:{startsWith:prefix}},select:{id:true,guid:true,revision:true,createdByUserId:true,number1c:true,status:true,syncState:true,deliveryMethod:true,totalAmount:true,queuedAt:true,sentTo1cAt:true,updatedAt:true,lastExportError:true,last1cError:true}});
                if(!order){console.log(JSON.stringify({stage:'missing-prefix',prefix}));continue}
                const profile=await db.employeeProfile.findUnique({where:{userId:order.createdByUserId},select:{onecUserGuid:true}});
                const live=await findLiveClientOrder({managerGuid:profile.onecUserGuid,appGuid:order.guid,number1c:order.number1c});
                console.log(JSON.stringify(clean({stage:'direct-onec-proof',order,live:live&&{guid:live.guid,appGuid:live.appGuid,number1c:live.number1c,status:live.status,isPostedIn1c:live.isPostedIn1c,deliveryMethod:live.deliveryMethod,deliveryDate:live.deliveryDate,totalAmount:live.totalAmount,rows:live.items?.length}})));
                const receipt=await db.clientOrderSubmission.findFirst({where:{orderGuid:order.guid},orderBy:{acceptedAt:'desc'}});
                const canonical=await getStoredClientOrderForSubmission(order.guid,order.createdByUserId);
                const proofReader=require('/app/dist/modules/clientOrders/clientOrderSubmissions').getClientOrderSubmissionOrder;
                if(typeof proofReader==='function'&&receipt){
                  const result=await proofReader(order.createdByUserId,receipt.id,getStoredClientOrderForSubmission);
                  if(result?.acceptedSubmission?.payloadHash!==receipt.payloadHash||result?.guid!==order.guid)throw Error('Canonical receipt proof mismatch');
                  console.log(JSON.stringify({stage:'deployed-receipt-proof',prefix,orderGuid:result.guid,proofMatchesOriginal:true,number1c:result.number1c}));
                }
                const headers=['organizationGuid','counterpartyGuid','agreementGuid','contractGuid','warehouseGuid','deliveryAddressGuid','priceTypeGuid','deliveryMethod','paymentForm','deliveryDate'];
                const relationKeys={organizationGuid:'organization',counterpartyGuid:'counterparty',agreementGuid:'agreement',contractGuid:'contract',warehouseGuid:'warehouse',deliveryAddressGuid:'deliveryAddress',priceTypeGuid:'priceType'};
                console.log(JSON.stringify(clean({stage:'receipt-order-comparison',prefix,receipt:receipt&&{id:receipt.id,clientOrderId:receipt.clientOrderId,clientRevision:receipt.clientRevision,payloadHash:receipt.payloadHash,state:receipt.state},canonical:{guid:canonical.guid,origin:canonical.origin,createdByUser:canonical.createdByUser,status:canonical.status,syncState:canonical.syncState,clientOrderId:canonical.clientOrderId,clientRevision:canonical.clientRevision},headers:headers.map(key=>({key,submitted:receipt?.payload?.[key]??null,current:relationKeys[key]?canonical[relationKeys[key]]?.guid??null:canonical[key]??null})),lines:receipt?.payload?.items?.map(row=>({lineGuid:row.lineGuid,productGuid:row.productGuid,quantity:row.quantity,manualPrice:row.manualPrice,packageGuid:row.packageGuid,unitGuid:row.unitGuid})),serverLines:canonical.items?.map(row=>({lineGuid:row.lineGuid,productGuid:row.product?.guid,quantity:row.quantity,price:row.price,packageGuid:row.package?.guid,unitGuid:row.unit?.guid}))})));
              }
              console.log(JSON.stringify({stage:'database-pool',stats:await db.$queryRawUnsafe("SELECT state, wait_event_type, wait_event, count(*)::int FROM pg_stat_activity WHERE datname=current_database() GROUP BY 1,2,3") }));
            })().catch(e=>{console.error(JSON.stringify(clean({failure:e.message})));process.exitCode=1}).finally(async()=>{await db.$disconnect();await pool.end();clearTimeout(deadline);process.exit(process.exitCode||0)});
            NODE
            cd /opt/leader-api
            sha256sum --check backups/prod-order-status-delivery-20261018/config-checksums.before
            readlink -f /var/www/leader-order-prod/current
