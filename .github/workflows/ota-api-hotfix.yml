name: Read-only production order inbox diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -eu
            docker inspect leader_api --format '{{.State.Health.Status}} {{.Config.Image}}'
            docker exec -i leader_api node <<'NODE'
            const deadline=setTimeout(()=>{console.error('Diagnostic deadline');process.exit(2)},45000);
            const {default:db,pool}=require('/app/dist/prisma/client');
            const clean=v=>JSON.parse(JSON.stringify(v).replace(/(apiKey[=\"\s:]+)[^&\s\"]+/gi,'$1[redacted]').replace(/postgres(?:ql)?:\/\/[^\s\"]+/gi,'[database]'));
            (async()=>{
              if(!String(process.env.ONEC_LP_APP_BASE_URL).toLowerCase().includes('torg2026'))throw Error('Not production 1C');
              console.log(JSON.stringify({stage:'flags',at:new Date().toISOString(),asyncEnabled:process.env.CLIENT_ORDERS_ASYNC_SUBMISSIONS_ENABLED,workerDisabled:process.env.CLIENT_ORDERS_SUBMISSION_WORKER_DISABLED,exportDisabled:process.env.CLIENT_ORDERS_EXPORT_WORKER_DISABLED}));
              console.log(JSON.stringify({submissionCounts:await db.clientOrderSubmission.groupBy({by:['state'],_count:true})}));
              const submissions=await db.clientOrderSubmission.findMany({where:{OR:[{state:{not:'QUEUED'}},{acceptedAt:{gte:new Date('2026-10-17T18:00:00Z')}}]},orderBy:{acceptedAt:'asc'},take:60});
              for(const s of submissions)console.log(JSON.stringify(clean({stage:'submission',id:s.id,userId:s.userId,clientOrderId:s.clientOrderId,revision:s.clientRevision,state:s.state,orderGuid:s.orderGuid,attempts:s.attempts,nextAttemptAt:s.nextAttemptAt,leaseUntil:s.leaseUntil,errorCode:s.errorCode,errorMessage:s.errorMessage,errorDetails:s.errorDetails,acceptedAt:s.acceptedAt,updatedAt:s.updatedAt,deliveryMethod:s.payload?.deliveryMethod,deliveryDate:s.payload?.deliveryDate,rows:s.payload?.items?.length})));
              const orders=await db.order.findMany({where:{source:'MANAGER_APP',OR:[{guid:{startsWith:'898cecdb'}},{guid:{startsWith:'d6a73aa7'}},{guid:{startsWith:'af0d2187'}},{number1c:{in:['НОУТ-125312','НОУТ-125211']}},{status:{in:['QUEUED','REJECTED']},updatedAt:{gte:new Date('2026-10-15T18:00:00Z')}}]},orderBy:{updatedAt:'desc'},take:65,select:{id:true,guid:true,clientOrderId:true,clientRevision:true,revision:true,number1c:true,status:true,syncState:true,createdByUserId:true,createdAt:true,updatedAt:true,queuedAt:true,submitRequestedAt:true,sentTo1cAt:true,exportAttempts:true,lastExportError:true,last1cError:true,isPostedIn1c:true,totalAmount:true,deliveryMethod:true,deliveryDate:true,counterparty:{select:{name:true}},createdByUser:{select:{firstName:true,lastName:true}},_count:{select:{items:true}}}});
              console.log(JSON.stringify(clean({stage:'orders',orders})));
              console.log(JSON.stringify({stage:'database-pool',stats:await db.$queryRawUnsafe("SELECT state, wait_event_type, wait_event, count(*)::int FROM pg_stat_activity WHERE datname=current_database() GROUP BY 1,2,3") }));
            })().catch(e=>{console.error(JSON.stringify(clean({failure:e.message})));process.exitCode=1}).finally(async()=>{await db.$disconnect();await pool.end();clearTimeout(deadline);process.exit(process.exitCode||0)});
            NODE
