name: Scoped recovery of order 126165
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [inspect, send, verify]
        default: inspect
      source_revision:
        type: string
        default: ''
      source_hash:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Load scoped script
        run: echo "SCRIPT_B64=$(base64 -w0 scripts/diagnostics/recover-order126165-20261019.cjs)" >> "$GITHUB_ENV"
      - name: Back up only the authorized order before recovery
        if: inputs.phase == 'send'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            umask 077
            target=/opt/leader-api/backups/recover-126165-20261019
            test ! -e "$target"
            mkdir -m 700 "$target"
            docker exec -i leader_api node > "$target/before.json" <<'NODE'
            const {default:db,pool}=require('/app/dist/prisma/client');
            (async()=>{
              if(process.env.NODE_ENV!=='production'||new URL(process.env.DATABASE_URL).pathname!=='/LeaderAPI')throw Error('Not production');
              const guid='33d4c1cc-d71d-48c4-b634-a1eeb15a7dbf',clientOrderId='007955a1-8912-48ee-8737-b109ee766cab',userId=99;
              const order=await db.order.findUnique({where:{guid},include:{items:true,events:true}});
              if(order.createdByUserId!==userId||order.clientOrderId!==clientOrderId||order.number1c!=='НОУТ-126165'||order.clientRevision!==29)throw Error('Order drift');
              const submissions=await db.clientOrderSubmission.findMany({where:{userId,clientOrderId},orderBy:{clientRevision:'asc'}});
              const backup=await db.clientOrderDraftBackup.findUnique({where:{userId_clientOrderId:{userId,clientOrderId}}});
              console.log(JSON.stringify({at:new Date().toISOString(),order,submissions,backup}));
            })().catch(e=>{console.error(e.message);process.exitCode=1}).finally(async()=>{await db.$disconnect();await pool.end()});
            NODE
            test -s "$target/before.json"
            chmod 600 "$target/before.json"
            sha256sum "$target/before.json"
            stat -c '%a %s %n' "$target/before.json"
      - name: Inspect or recover only the authorized document
        uses: appleboy/ssh-action@v1
        env:
          RECOVERY_PHASE: ${{ inputs.phase }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          SOURCE_HASH: ${{ inputs.source_hash }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SCRIPT_B64,RECOVERY_PHASE,SOURCE_REVISION,SOURCE_HASH
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/leader-api
            test "$(docker inspect leader_api --format '{{.State.Health.Status}}')" = healthy
            printf '%s' "$SCRIPT_B64" | base64 -d | docker exec -i -e RECOVERY_PHASE="$RECOVERY_PHASE" -e SOURCE_REVISION="$SOURCE_REVISION" -e SOURCE_HASH="$SOURCE_HASH" leader_api node
